[project]
name = "missav-downloader"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "cloudscraper",
    "beautifulsoup4",
    "m3u8",
    "pycryptodome",
    "tqdm",
]

[project.scripts]
missav = "missav:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
